services:
   skeleton-database:
      container_name: skeleton-database
      image: mariadb:latest
      restart: unless-stopped
      environment:
         MARIADB_ROOT_PASSWORD: rootpassword
         MARIADB_DATABASE: testdb
         MARIADB_USER: api
         MARIADB_PASSWORD: mypassword
      ports:
         - '3306:3306'
      volumes:
         - skeleton_database_data:/var/lib/mysql
         - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
   skeleton_api:
      container_name: skeleton
      image: node:latest
      restart: unless-stopped
      working_dir: /app/src
      volumes:
         - ./:/app/src
      depends_on:
         - skeleton_database
      ports:
         - '3000:3000'
      command: './run.sh'

volumes:
   skeleton_database_data:
